<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISAR Earth Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./styleApp.css">
<link rel="stylesheet" href="./styleExtra.css">
</head>
<body>
<header>
<button class="brand" id="home" title="Home"><svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="var(--ac)"/><circle cx="18" cy="18" r="6" stroke="#fff" stroke-width="2"/><ellipse cx="18" cy="18" rx="13" ry="5" transform="rotate(-30 18 18)" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/></svg><span><h1>NISAR Earth Intelligence</h1><small data-i="sub"></small></span></button>
<div class="sp"></div>
<div class="stepper"><div class="stp on" id="s1"><i>1</i><span data-i="s1"></span></div><div class="stp" id="s2"><i>2</i><span data-i="s2"></span></div><div class="stp" id="s3"><i>3</i><span data-i="s3"></span></div></div>
<button class="ibtn" id="lang"></button>
<button class="ibtn" id="theme" aria-label="theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<div class="app" id="app">
<aside id="side">
 <div><label data-i="lType"></label><select class="sel" id="selT"></select><div id="typeInfo"></div></div>
 <div class="aoi" id="aoiInfo"></div>
 <div class="g2"><div><label data-i="d1"></label><select class="sel" id="dd1"></select></div><div><label data-i="d2"></label><select class="sel" id="dd2"></select></div></div>
 <div class="hint" id="dMsg" style="margin:0"></div>
 <div class="acts" style="margin:0"><button class="btn" id="search" disabled></button><button class="btn pri" id="run" disabled></button></div>
 <details open><summary data-i="hScn"></summary><div id="p-scn"></div></details>
 <details open><summary data-i="hRes"></summary><div id="p-res"></div></details>
 <details open><summary data-i="hRep"></summary><div id="p-rep"></div></details>
</aside>
<section class="map">
 <div id="map"></div>
 <div class="tools"><button class="tb pri" id="draw"></button><button class="tb" id="zin">＋</button><button class="tb" id="zout">－</button><button class="tb" id="wld"></button><button class="tb" id="clr"></button></div>
 <div class="chip" id="coord">—</div>
</section>
</div>

<dialog id="dlg"><div class="dh"><b id="dT"></b><button class="btn pri" id="dPdf" data-i="pdf"></button><button class="btn" id="dX" data-i="close"></button></div><div class="db" id="dlgB"></div></dialog>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="./scriptApp.js"></script>
</body>
</html>
